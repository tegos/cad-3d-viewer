version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Order matters: a dependency lands in the first group it matches.
      babylonjs:
        patterns:
          - "@babylonjs/*"
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
      production-security:
        applies-to: security-updates
        dependency-type: production
      dev-security:
        applies-to: security-updates
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
